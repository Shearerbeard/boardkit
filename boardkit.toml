# boardkit.toml — generated by `boardkit init`

[board]
# Directory (relative to this file) holding the card registry.
cards_dir = "docs/board/cards"
# Prefix for numbered card ids, e.g. "S" for S1, S2, ...
id_prefix = "S"
# Non-numbered card ids that stand outside the prefix scheme.
sentinel_ids = ["MILESTONE"]
# Branch this board's host repo should sit on (doctor host.base-branch).
base_branch = "master"

[review]
# Path (relative to this file) to the git repo review packets diff against.
repo = "."
# Directory (relative to this file) review packets are written to.
output_dir = "docs/board/reviews"

# The R10 board charter (dogfood, authored at S20). `owns` is mirrored
# byte-for-byte into this board's registry row in .boardkit/manifest.toml;
# `boardkit check` fails when they drift.
[charter]
owns = "the kit family: boardkit itself, rust-holes, and the prose bench"
not = "consumer-repo process fixes and aura-family work"

[charter.route]
aura = "aura-family cards, epics, and consolidation work"

# The delegation contract: which transport serves each role. Scaffolded with
# placeholders — fill them in, then run `boardkit doctor`.
[contract]
version = 2

# One [routes.<name>] table per transport you can dispatch to. Names are
# lowercase slugs.

# The board owner's own harness: Claude Code sessions author cards and run
# the drift audit in-harness. Loads no child skill.
[routes.claude-session]
adapter = "claude-code"
skill = ""
pin_source = "docs/board/REVIEW-TOOLING.md#harness-bindings"
preflight = []
staging = "repo-native"

[routes.opencode-reviewer]
adapter = "opencode"
skill = "opencode-cli"
pin_source = "docs/board/REVIEW-TOOLING.md#harness-bindings"
preflight = ["opencode --version"]
staging = "working-dir"

[routes.codex-reviewer]
adapter = "codex"
skill = "codex-cli"
pin_source = "docs/board/REVIEW-TOOLING.md#harness-bindings"
preflight = ["codex --version"]
staging = "repo-native"

[routes.agy-reviewer]
adapter = "antigravity"
skill = "collaborating-with-antigravity"
pin_source = "docs/board/REVIEW-TOOLING.md#harness-bindings"
preflight = ["command -v agy"]
staging = "working-dir"

# One [roles.<name>] table per required role. `routes` is the ordered
# fallback list; every name must be declared above.
[roles.executor]
routes = ["claude-session"]

[roles.code-review]
routes = ["opencode-reviewer", "codex-reviewer"]

[roles.prose-review]
routes = ["agy-reviewer", "codex-reviewer"]

[roles.frontier-review]
routes = ["codex-reviewer", "opencode-reviewer"]

[roles.drift-audit]
routes = ["claude-session"]

# The canary is a hard stop at session close, so this role carries the one
# cross-provider escape on the board: an opencode outage must not strand a
# session that is otherwise ready to close.
[roles.canary]
routes = ["opencode-reviewer", "codex-reviewer"]
