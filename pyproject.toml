[project]
name = "boardkit"
version = "0.0.1"
description = "Card-board process kit: gated kanban boards, typed-holes dev flow, and model-class delegation for AI-assisted development."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mike Shearer" }]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
boardkit = "boardkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.20,<0.8.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
