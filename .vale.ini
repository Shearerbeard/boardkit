# Prose gate for the kit's own shipped templates and docs. The templates
# impose a prose standard on consumers (PROCESS.md commit standards), so
# the kit holds itself to the same one; tests/test_templates_prose.py
# enforces it over src/boardkit/data/templates/. One-time setup (the
# styles dir must exist first or vale syncs to its global path instead):
#   mkdir -p .vale/styles && vale sync
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.13.1/ai-tells.zip

# Shipped templates use a .template suffix; lint them as markdown.
[formats]
template = md

[*{.md,.template}]
BasedOnStyles = ai-tells
# Off: the shipped docs write dashes as spaced hyphens by convention, and
# the rule flags that shape. Same suppression as the maintainer's global
# vale config, carried here so the repo gate matches it.
ai-tells.EmDashUsage = NO
# Off: process contracts legitimately use formal register (invariant,
# defer, disposition); flagging it would fight the domain vocabulary.
ai-tells.FormalRegister = NO

# The golden fixtures are byte-identical copies of a source repo's board;
# linting them would demand edits the provenance rule forbids.
[tests/golden/**]
BasedOnStyles =

# Templates ship with placeholder comments and fill-in prose; they follow
# the rules above with no extra exemptions on purpose - the D6 gate.
