# Prose gate for the kit's own shipped templates and docs. The templates
# impose a prose standard on consumers (PROCESS.md commit standards), so
# the kit holds itself to the same one; tests/test_templates_prose.py
# enforces it over src/boardkit/data/templates/. Run `vale sync` once to
# fetch the styles into .vale/styles (gitignored).
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Shipped templates use a .template suffix; lint them as markdown.
[formats]
template = md

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.13.1/ai-tells.zip

[*{.md,.template}]
BasedOnStyles = ai-tells
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO

# The golden fixtures are byte-identical copies of a source repo's board;
# linting them would demand edits the provenance rule forbids.
[tests/golden/**]
BasedOnStyles =

# Templates ship with placeholder comments and fill-in prose; they follow
# [*.md] with no extra exemptions on purpose - this is the D6 gate.
